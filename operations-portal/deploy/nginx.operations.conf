upstream wallet_django_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name 178.128.156.225 _;

    client_max_body_size 10M;

    location /static/ {
        alias /var/www/backend/Wallet-Backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/www/backend/Wallet-Backend/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /operations {
        return 301 /operations/;
    }

    location ^~ /operations/ {
        alias /var/www/backend/Wallet-Backend/operations-portal/dist/;
        index index.html;
        try_files $uri $uri/ /operations/index.html;
    }

    location ^~ /api/ {
        proxy_pass http://wallet_django_api/api/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-CSRFToken $http_x_csrftoken;
    }

    location = /health/ {
        proxy_pass http://wallet_django_api/health/;
        access_log off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://wallet_django_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
    }

}
