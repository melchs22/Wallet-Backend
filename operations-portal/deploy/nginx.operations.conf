# Replace operations.example.com with the hostname assigned to this portal.
# The Django site can continue serving /admin/ on its own hostname.
upstream wallet_operations_frontend {
    server 127.0.0.1:3100;
    keepalive 16;
}

upstream wallet_django_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name operations.example.com;

    client_max_body_size 10M;

    location ^~ /api/ {
        proxy_pass http://wallet_django_api/api/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-CSRFToken $http_x_csrftoken;
    }

    location / {
        proxy_pass http://wallet_operations_frontend;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }
}
