services:
  - type: web
    name: wallet-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python manage.py seed_periodic_tasks && python manage.py collectstatic --noinput
    startCommand: gunicorn walletmvp.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: wallet-redis
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: wallet-db
          property: connectionString
      - key: DJANGO_SETTINGS_MODULE
        value: walletmvp.settings
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

  - type: worker
    name: wallet-celery-worker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A walletmvp worker -l info --concurrency 2
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: wallet-redis
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: wallet-db
          property: connectionString
      - key: DJANGO_SETTINGS_MODULE
        value: walletmvp.settings
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

  - type: worker
    name: wallet-celery-beat
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py migrate
    startCommand: celery -A walletmvp beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: wallet-redis
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: wallet-db
          property: connectionString
      - key: DJANGO_SETTINGS_MODULE
        value: walletmvp.settings

  - type: keyvalue
    name: wallet-redis
    plan: free
    ipAllowList: []

databases:
  - name: wallet-db
    plan: free
